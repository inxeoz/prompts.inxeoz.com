<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta name="theme-color" content="#faf8f2">
<script>(function(){try{var s=localStorage.getItem("theme");if(!s){s=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",s)}catch(e){}})();</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
<a class="brand" href="/">prompts.inxeoz.com</a>
<nav>
<a href="/prompts/">index</a>
<button id="theme-toggle" type="button" aria-label="Toggle dark mode">dark</button>
</nav>
</header>
<main>{{ block "main" . }}{{ end }}</main>
<footer><span>plain-text prompts. no tracking, no signup.</span></footer>
<script src="/site.js" defer></script>
</body>
</html>
